name: test

# 测试门禁：四个测试文件跑全（engine / meta / skills / ui），任一失败即红。
# 与 codeql.yml 互不影响，两者都在 push/PR 上跑。

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  node-test:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (latest LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install devDependencies (jsdom)
        run: npm install

      - name: Run test suite
        run: npm test
