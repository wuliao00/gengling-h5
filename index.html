<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#FFF8E7" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="assets/icon-1024.png" />
<link rel="icon" type="image/png" href="assets/icon-1024.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>梗灵大陆</title>
<link rel="stylesheet" href="css/game.css" />
<link rel="stylesheet" href="css/kawaii.css" />
</head>
<body>
<div id="app">

  <!-- 全局顶栏：所有场景共用（左：返回/暂停 + 标题，右：资源胶囊） -->
  <header id="topbar">
    <button class="tb-btn" id="tbBack" type="button" hidden>‹</button>
    <div class="topbar-title" id="tbTitle">梗灵大陆</div>
    <div class="tb-res" id="tbRes">
      <div class="res-chip chip-energy" title="体力">
        <i class="ico-bolt"></i><b id="tbEnergy">--</b>
      </div>
      <div class="res-chip chip-gold" title="金币">
        <i class="ico-coin"></i><b id="tbGold">--</b>
      </div>
    </div>
  </header>

  <!-- 七大场景：内容由 js/ui/scenes.js 动态填充 -->
  <div class="scene" id="scene-home"></div>
  <div class="scene" id="scene-map"></div>
  <div class="scene" id="scene-lineup"></div>

  <div class="scene" id="scene-battle">
    <!-- 唯一的棋盘画布，由 render.js 渲染、input.js 接管指针 -->
    <canvas id="board"></canvas>
  </div>

  <div class="scene" id="scene-result"></div>
  <div class="scene" id="scene-chars"></div>
  <div class="scene" id="scene-shop"></div>

</div>
<div id="toast-root"></div>
<div id="modal-root"></div>
<script>
  // PWA：注册 Service Worker（需 HTTPS 或 localhost 安全上下文）
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
